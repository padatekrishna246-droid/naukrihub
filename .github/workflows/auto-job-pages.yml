name: NaukriHub Auto Job Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "generate-jobs.js"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/auto-job-pages.yml"

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create temporary Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > serviceAccountKey.json

      - name: Generate job pages and sitemap
        run: node generate-jobs.js

      - name: Check generated changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- jobs sitemap.xml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated pages and sitemap
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs sitemap.xml
          git commit -m "Auto-update job pages and sitemap"
          git push

      - name: Protect service account from Hosting upload
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const file = "firebase.json";
          const config = JSON.parse(fs.readFileSync(file, "utf8"));

          config.hosting = config.hosting || {};
          config.hosting.ignore = config.hosting.ignore || [];

          if (!config.hosting.ignore.includes("serviceAccountKey.json")) {
            config.hosting.ignore.push("serviceAccountKey.json");
          }

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2) + "\n"
          );
          NODE

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/serviceAccountKey.json
        run: |
          npx firebase-tools@latest deploy \
            --only hosting \
            --project naukrihub-61299 \
            --non-interactive

      - name: Remove temporary service account
        if: always()
        run: rm -f serviceAccountKey.json
